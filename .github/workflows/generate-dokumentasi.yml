name: Analisis dan Dokumentasi Otomatis

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dokumentasi:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analisis source code
        run: python alat/analisis_repository.py

      - name: Simpan dokumentasi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dokumentasi
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan dokumentasi."
            exit 0
          fi
          git commit -m "docs: perbarui dokumentasi dan diagram otomatis"
          git push
